# Example embarch-api config. Copy this to a real path (e.g. ~/.config/embarch/api.toml),
# fill in the real EMBARCH_TOKEN, and pass it via `--config <path>` or the
# EMBARCH_API_CONFIG env var. Do not commit a copy of this file with a real
# token inline — use token_env instead, or chmod 600 it and keep it out of git.

[core]
# Either an explicit URL, or the literal "auto" to discover Core at first use.
# Prefer "auto" unless you have a reason not to: it probes loopback, then the
# Windows host gateway when running under WSL2, then `host` below — so a WSL2
# restart changing that gateway IP costs you nothing. An explicit URL is still
# honored as-is and always wins.
base_url = "auto"
# base_url = "http://127.0.0.1:4884"
#
# Only consulted by base_url = "auto": Core on a genuinely separate machine,
# probed last, after the local candidates.
# host = "bench.local"
# port = 4884
# Either inline the token (then chmod 600 this file and gitignore it), or
# point at an env var name so the secret never has to live in the file:
# token = "same-value-as-Core's-EMBARCH_TOKEN"
token_env = "EMBARCH_TOKEN"
status_timeout_secs = 10
reset_timeout_secs = 10
flash_timeout_secs = 120
serial_timeout_secs = 15

# Example project #1: Zephyr/west-based board, app source in a subdirectory,
# discovery = "static" (the default — omitted below since it's implicit).
# Board arg and artifact path below are the standard `west build` layout
# (CMakeCache.txt / build/zephyr/zephyr.hex). Only set build_cwd if your west
# invocation is actually cd'ed into that subdirectory — west's default build
# dir is <cwd>/build, so if you instead run `west build ... <app-path>` from
# source_path (passing the app dir as an argument, as below), leave build_cwd
# unset: the artifact still lands under source_path/build, not
# source_path/<app-path>/build. Confirm which pattern your own build actually
# uses (see e.g. build/build_info.yml's recorded `west.command` after a real
# build) rather than assuming — a mismatch here silently makes
# build_and_flash/flash never find a fresh artifact.
#
# A project shaped like this one (Zephyr/west, one hand-picked board) is a
# fine, fully-supported way to configure it. If the repo actually has several
# real boards/variants/revisions worth selecting between at call time instead
# of one hand-picked combination, see example project #3 below
# (discovery = "zephyr-west", decision 12) instead.
#
# The consequence to know before picking this shape: a static project runs the
# build_command below verbatim, so a call that passes board, variant, revision,
# app, snippets or extra_args is **refused**, naming which of them were given
# (decision 51). It is not that they are ignored — they used to
# be, and a build with two snippets reported success having built without them.
[[projects]]
name = "my-nrf-project"
source_path = "/path/to/my-nrf-project"
build_command = ["west", "build", "-b", "my_board@1/nrf54l15/cpuapp", "app/firmware"]
artifact_path = "build/zephyr/zephyr.hex"
# Confirm the exact probe-rs target name, e.g. via
# `probe-rs chip list | grep -i nrf54`.
chip = "nRF54L15"
flash_format = "hex"
# Optional: the flash offset to write the artifact at, passed through to
# Core (decision 42). Not needed here — a `hex` image
# carries its own load address — but *required in practice* for a
# flash_format = "bin" project, whose raw binary carries none. Write it as a
# TOML hex literal; it's a build-config fact of the project, deliberately not
# something a caller (or an agent) supplies per flash.
# base_address = 0x2000
build_timeout_secs = 900
# Optional: additive over the inherited environment, not a replacement —
# PATH and toolchain setup stay with whatever launches this process.
# env = { CMAKE_BUILD_TYPE = "Debug" }
# Optional: fallbacks for serial_log's own port/baud params when a call
# omits them. baud defaults to 115200 when unset.
# serial_port = "/dev/ttyACM0"
# serial_baud = 115200
# Optional: disambiguates this project's own debug probe when more than one
# is attached (embarch-core decision 9, decisions/probes.md — NOT this repo's
# own decision 9, which is about locked dependency choices) — matched against status's own
# probes[].serial_number. Omitted, Core falls back to first-probe-found.
# probe_serial = "001050253368"
# Optional: how to produce this project's own firmware version string, run
# in source_path, for `run_study --reflash dut|both` (decision
# 40) — trimmed stdout becomes the reported version. Defaults to the
# invocation below; only consulted on an actual reflash. A git argv naming a
# tree-mutating subcommand is refused, wherever in the argv it appears.
# version_command = ["git", "describe", "--always", "--dirty", "--abbrev=8"]

# Example project #2: also Zephyr/west-based, different chip family.
[[projects]]
name = "my-stm32-project"
source_path = "/path/to/my-stm32-project"
build_command = ["west", "build", "-b", "my_other_board"]
artifact_path = "build/zephyr/zephyr.hex"
# Confirm the exact probe-rs target name, e.g. via
# `probe-rs chip list | grep -i stm32f446`.
chip = "STM32F446ZE"
flash_format = "hex"
build_timeout_secs = 900

# Example project #3: discovery = "zephyr-west" (decision 12) —
# for a repo with several real boards/variants/hardware-revisions worth
# selecting between at call time, rather than one hand-picked combination
# baked into config. Note what's absent compared to projects #1/#2: no
# build_command, chip, or artifact_path — those are resolved live, per call,
# from board/variant/revision/app params on build/flash/build_and_flash (see
# list_targets), validated against what boards/*/*.yml and app/*/ actually
# declare and back with real revision-suffixed overlay/defconfig files. chip
# comes from embarch-core's POST /resolve-chip, not a value typed here. The
# reverse also holds: west_binary, build_dir_root, default_snippets,
# default_extra_args and [projects.default_target] are all rejected outright
# on a discovery = "static" project, which can honour none of them — a
# config that cannot ever be honoured fails at load rather than carrying a
# line that reads as meaningful and does nothing.
[[projects]]
name = "my-multi-board-project"
source_path = "/path/to/my-multi-board-project"
discovery = "zephyr-west"
# west isn't always on bare PATH (e.g. inside a workspace venv) — point at
# the exact binary this repo's build actually uses.
west_binary = "/path/to/my-multi-board-project/.venv/bin/west"
# Parent directory under which each distinct (board, variant, revision, app,
# snippets) target gets its own build subdirectory — never shared between
# targets.
build_dir_root = "/path/to/my-multi-board-project/embarch/build"
flash_format = "hex"
build_timeout_secs = 900
# Optional: -S snippet(s) applied whenever a build/flash/build_and_flash call
# omits `snippets` entirely — for a repo whose normal dev build always wants
# the same one(s) (e.g. a shell-over-BLE snippet), so moving it to
# discovery = "zephyr-west" doesn't silently drop that from every call unless
# a caller remembers to pass snippets by hand. A call that does pass
# snippets overrides this entirely, it doesn't add to it. Validated against
# app/<app>/snippets/*/snippet.yml the same way board/variant/revision are
# validated against boards/*/*.yml — see list_targets' snippets_by_app.
# Rejected outright for a discovery = "static" project, which honours no
# snippet at all.
# default_snippets = ["ble-shell"]
# A call that wants a build with NO snippets despite this default passes the
# reserved literal ["none"] (--snippet none on the CLI), alone: an empty list
# is indistinguishable from an omitted one, so there'd otherwise be no way to
# say it. A list mixing "none" with real snippet names is refused naming the
# ambiguity rather than resolved one way. The literal cannot be written here:
# as a default it would just mean what omitting this field already means.
# Optional: extra west build flags applied whenever a call omits `extra_args`
# entirely — e.g. a repo that always wants a pristine rebuild. Same
# override-not-additive semantics as default_snippets, but opaque: unlike
# snippets, there's no real-file list to validate arbitrary flags against, so
# these are passed straight through to west build unchanged. Rejected
# outright for a discovery = "static" project, whose build_command is
# configured in full and takes nothing appended.
# default_extra_args = ["-p", "always"]
# Optional: the BASE (board, variant, revision, app) selection a call narrows
# from. Set what pins this repo's common target; a call naming one of these
# overrides it for that field alone, and list_targets reports it so the
# pinning is visible from the menu. Without it, a bare `build` against a repo
# with exactly one target resolves today and starts erroring "ambiguous" the
# moment a second board lands — behaviour changing because somebody else's
# commit grew the repo. Rejected outright for a discovery = "static" project,
# which honours no selection at all.
# [projects.default_target]
# board = "my_board"
# app = "my-app"

# embarch-dev-bench's own firmware — deliberately NOT a [[projects]] entry
# (decision 32): dev-bench isn't a DUT a
# firmware engineer or an agent configures/discovers, it's EmbArch's own test
# rig, one board at a time, addressed by no project name. Enables
# build_dev_bench/flash_dev_bench/build_and_flash_dev_bench; omit this table
# entirely if you don't run embarch-dev-bench firmware from this machine.
#
# board/chip/flash_format/artifact_path used to be constants in dev_bench.rs
# rather than fields here, on the premise that there was one dev-bench board
# forever. There isn't: the bench has been an nRF54L15DK, then an ESP32-C5
# when the DK broke, then an nRF54L15DK again (2026-08-31), and those two
# boards disagree about every one of the four. None of them is defaulted —
# a default has to pick one of the two, and picking wrong flashes the wrong
# image through the wrong debug interface at the wrong chip.
#
# --- the nRF54L15DK bench (NCS workspace: sysbuild, so build/app/..., hex) ---
# [dev_bench]
# source_path = "/path/to/embarch-dev-bench/workspaces/nordic"
# west_binary = "/path/to/venv/bin/west"
# board = "nrf54l15dk/nrf54l15/cpuapp"
# chip = "nRF54L15"
# flash_format = "hex"
# artifact_path = "build/app/zephyr/zephyr.hex"   # relative to source_path
# build_timeout_secs = 900
#
# --- the ESP32-C5 bench (vanilla Zephyr: no sysbuild, bin + base_address) ---
# [dev_bench]
# source_path = "/path/to/embarch-dev-bench/workspaces/espressif"
# west_binary = "/path/to/venv/bin/west"
# board = "esp32c5_devkitc/esp32c5/hpcore"
# chip = "esp32c5"
# flash_format = "bin"
# artifact_path = "build/zephyr/zephyr.bin"
# base_address = 0x2000    # required for bin, rejected for hex
# build_timeout_secs = 900
