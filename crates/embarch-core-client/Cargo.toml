[package]
name = "embarch-core-client"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Extracted from embarch-api's own `core_client.rs`/`config.rs::CoreConfig`/
# `token_discovery.rs` (2026-08-24, `embarch-ui` decision 5's
# resolution): the one implementation of
# "how do I reach embarch-core over HTTP+Bearer," shared by embarch-api and
# embarch-ui rather than duplicated between them — the same "one
# implementation, multiple call sites" shape `embarch-topology`
# decisions 2/8/14 already established for topology detection/enrollment.

[dependencies]
anyhow = "1.0.103"
bytes = "1"
embarch-study-designer = { path = "../../../embarch-study-designer" }
# `wire` alongside `software` since 2026-09-12 (`suite/035`), spelled out
# rather than left to `default` so the absence of `hardware` is visible at the
# one place a future edit would add it. `software` is what
# `client.rs`'s `ProbeOutcome`/`TopologyClass` need; `wire` is what makes
# `hardware::{EnrolledBoard, Alert, DetectedPort, SignalLink, Route,
# SignalDirection}` nameable here — pure serde, no `probe-rs`, no
# `serialport`, no C toolchain (`embarch-topology` decision 31). This crate
# still must never link the hardware half, and now it no longer pays for that
# rule with seven hand-maintained mirrors.
embarch-topology = { path = "../../../embarch-topology", default-features = false, features = ["software", "wire"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "multipart"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# `process` is for `version::derive_version` (moved here from
# `embarch-api`'s `reflash.rs` 2026-08-26): running a project-declared
# version command is a read of a working tree, and both `embarch-api` and
# `embarch-ui` need the same one.
# `time` is for `study_events` (2026-09-02): the SSE stream deliberately sets
# no `reqwest` request timeout, so its idle budget and its polling fallback's
# cadence are `tokio::time::timeout`/`sleep` here instead.
tokio = { version = "1.53.0", features = ["sync", "fs", "process", "time"] }
tracing = "0.1.44"

[dev-dependencies]
# Only for the manifest-beside-the-artifact test, which needs a real directory
# on disk: the rule it pins is a filesystem fact, not a string transformation.
tempfile = "3"
tokio = { version = "1.53.0", features = ["macros", "rt"] }
