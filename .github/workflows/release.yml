# Release CI for embarch-api (embarch-umbrella/milestone-6.md §3.7).
#
# Same four-target shape as embarch-core's release.yml, but simpler:
# embarch-api has no C dependency at all (rustls, not OpenSSL; no
# probe-rs/serialport), so aarch64-unknown-linux-gnu only needs a
# cross-linker, not `cross`'s Docker-based build with a custom sysroot.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  BIN: embarch-api

permissions:
  contents: write

jobs:
  # embarch-umbrella decisions 27/29: no release may build a binary whose
  # `--version` disagrees with the tag that produced it. This job gates the
  # build matrix, so a mismatch costs one ubuntu runner-minute rather than
  # four cross-compiles, three sibling checkouts and an uploaded asset — the
  # decision's "failing the release outright" rather than catching it
  # afterwards. `doctor` check 1 compares installed binaries against the
  # suite manifest and therefore inherits this gap; it can only detect a
  # mismatch that already got shipped.
  #
  # Deliberately toolchain-free, and it checks out to the workspace root
  # rather than to `embarch-api/`: it reads `[package] version` out of
  # Cargo.toml with awk rather than `cargo metadata`, because this repo's
  # manifest has sibling path dependencies that only resolve once the other
  # checkouts exist — and the point is to fail before any of that setup runs.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo.toml version must match the pushed tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "ref $GITHUB_REF_NAME is not a tag (workflow_dispatch); nothing to compare"
            exit 0
          fi
          version=$(awk -F'"' '
            /^\[package\]/ { p = 1; next }
            /^\[/          { p = 0 }
            p && /^[[:space:]]*version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then
            echo "::error::could not read [package] version from Cargo.toml"
            exit 1
          fi
          if [ "$version" != "$tag" ]; then
            echo "::error::Cargo.toml version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Cargo.toml $version matches tag $GITHUB_REF_NAME"

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # No free aarch64-linux GitHub-hosted runner exists, but unlike
          # embarch-core this crate has no C library to cross-link, so a
          # plain cross-linker is enough — no `cross`/Docker needed.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: aarch64-linux-gnu-gcc
          # GitHub's macos-14 runner is natively Apple Silicon, so this is a
          # native build, not a cross-compile — and unsigned, which the user
          # guide has to mention (milestone-6.md §3.7, §5 open questions).
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    # Cargo.toml depends on both embarch-study-designer and embarch-topology
    # as sibling path dependencies (DOC-PROTOCOL.md §2's layout — no Cargo
    # workspace). `../embarch-study-designer`/`../embarch-topology` only
    # resolve if this repo's own checkout also sits in a same-named sibling
    # directory rather than at the workspace root, so every checkout below
    # gets an explicit `path:` and every later step runs from inside
    # `embarch-api/` — same fix as embarch-core's own release.yml, for the
    # same latent gap (no sibling checkout at all, previously).
    defaults:
      run:
        working-directory: embarch-api
    steps:
      - uses: actions/checkout@v4
        with:
          path: embarch-api
      - uses: actions/checkout@v4
        with:
          repository: gabrieltetar/embarch-study-designer
          path: embarch-study-designer
      - uses: actions/checkout@v4
        with:
          repository: gabrieltetar/embarch-topology
          path: embarch-topology

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross-linker
        if: matrix.linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ matrix.linker }}" ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="${{ matrix.linker }}"
          fi
          cargo build --release --target ${{ matrix.target }}

      # windows-latest already ships the VS Build Tools "Desktop development
      # with C++" workload an MSVC link needs (embarch-core/design.md §7,
      # which applies to every crate in the suite built for this target) —
      # nothing extra to install there.

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="${BIN}-${{ matrix.target }}"
          bin="${BIN}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then bin="${BIN}.exe"; fi
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${bin}" "dist/${name}/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "${name}.zip" "${name}" >/dev/null
            # `working-directory: embarch-api` only applies to `run:` steps,
            # not the `uses:` upload step below, so this output needs the
            # `embarch-api/` prefix.
            echo "asset=embarch-api/dist/${name}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${name}.tar.gz" "${name}"
            echo "asset=embarch-api/dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset }}
          fail_on_unmatched_files: true
