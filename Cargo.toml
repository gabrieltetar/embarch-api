# `crates/embarch-core-client` is a **workspace member**, not just a path
# dependency (2026-09-06, decision 56). A path dependency is built as a lib
# only, so its `#[cfg(test)] mod tests` is never compiled — which meant
# `cargo clippy --all-targets -- -D warnings` and `cargo test` run here both
# skipped that crate's 28 unit tests entirely, and a red `unused_imports`
# sat in `client.rs` unreported. `members` alone does not fix it:
# `cargo metadata` still reports this package as the sole default member, so
# a bare `cargo clippy` at the root still misses the sub-crate. It is
# `default-members` that makes the *unamended* gate command reach it, which
# is the point — the gate lives in `embarch-fleet/protocol.md` §10 and is
# not this repo's to change.
[workspace]
members = ["crates/embarch-core-client", "crates/embarch-firmware-build"]
default-members = [".", "crates/embarch-core-client", "crates/embarch-firmware-build"]

[package]
name = "embarch-api"
version = "0.1.0"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.103"
base64 = "0.22"
clap = { version = "4.6.2", features = ["derive"] }
# 2026-08-24: `core_client.rs`/`config::CoreConfig`/`token_discovery.rs`
# extracted into this shared crate (`embarch-ui` decision 5) so embarch-ui
# depends on the same implementation rather than a duplicated one.
# `bytes`/`reqwest` moved with
# it — this crate no longer touches either directly. `embarch-topology`
# also dropped as a direct dependency: its only use here was
# `CoreConfig`'s default port constant, which moved with `CoreConfig`.
embarch-core-client = { path = "crates/embarch-core-client" }
# 2026-09-18: `config.rs`/`zephyr.rs`/`resolve.rs`/`build.rs`/`json_out.rs`
# extracted into this shared crate (`embarch-ui` decision 11, reversed) so
# `embarch-ui` can build a study's firmware through the same implementation
# instead of a second copy of it. `serde_yaml` moved with it — this crate no
# longer touches it directly. Every `crate::config::…`/`crate::resolve::…`
# path in this crate still resolves: `main.rs` re-imports the modules at the
# crate root, the same way it already did for `build`.
embarch-firmware-build = { path = "crates/embarch-firmware-build" }
# `alloc` (`embarch-study-designer` decision 46) backs `Study.steps`
# with a heap `Vec` instead of a 64-slot inline array of ~600-byte `Step`s.
# This crate is the one that actually crashed on the old shape — a debug build
# overflowed its stack serving a live `study_status` over MCP — and, unlike
# embarch-core/embarch-ui, it enables none of the `std`-implying features that
# would pull `alloc` in anyway, so it has to ask for it by name.
# `reducers` (decisions 92 to 94 there) is what `verify` re-runs a measurement
# with (`embarch-api` decision 118); the registry keeps every behaviour shipped.
embarch-study-designer = { path = "../embarch-study-designer", features = ["alloc", "reducers"] }
# Ed25519 for `verify` check 0 only: `verify_strict` over a DSSE PAE.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
heapless = { version = "0.8", features = ["serde"] }
ihex = "3.0.0"
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
tokio = { version = "1.53.0", features = ["full"] }
toml = "1.1"
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = "0.3.23"
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }
# 2026-11-21 (api decision 110): the report-to-PDF renderer, behind the `pdf`
# feature. `typst-as-lib` supplies the world and the compile loop; its default
# resolvers (file system, package registry) are not used, `report_pdf` brings
# its own so the root can be confined and no registry is ever reachable.
typst = { version = "0.15.1", optional = true }
typst-pdf = { version = "0.15.1", optional = true }
typst-layout = { version = "0.15.1", optional = true }
typst-as-lib = { version = "0.18.0", optional = true, default-features = false, features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
include_dir = { version = "0.7.4", optional = true }
tempfile = { version = "3", optional = true }

[features]
default = ["pdf"]
pdf = ["dep:typst", "dep:typst-pdf", "dep:typst-layout", "dep:typst-as-lib", "dep:include_dir", "dep:tempfile"]
