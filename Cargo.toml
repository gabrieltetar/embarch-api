# `crates/embarch-core-client` is a **workspace member**, not just a path
# dependency (2026-09-06, decision 56). A path dependency is built as a lib
# only, so its `#[cfg(test)] mod tests` is never compiled — which meant
# `cargo clippy --all-targets -- -D warnings` and `cargo test` run here both
# skipped that crate's 28 unit tests entirely, and a red `unused_imports`
# sat in `client.rs` unreported. `members` alone does not fix it:
# `cargo metadata` still reports this package as the sole default member, so
# a bare `cargo clippy` at the root still misses the sub-crate. It is
# `default-members` that makes the *unamended* gate command reach it, which
# is the point — the gate lives in `embarch-fleet/protocol.md` §10 and is
# not this repo's to change.
[workspace]
members = ["crates/embarch-core-client"]
default-members = [".", "crates/embarch-core-client"]

[package]
name = "embarch-api"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
# 2026-08-24: `core_client.rs`/`config::CoreConfig`/`token_discovery.rs`
# extracted into this shared crate (`embarch-ui` decision 5,
# `embarch-ui`'s milestone-1.md §4.1) so embarch-ui depends on the same
# implementation rather than a duplicated one. `bytes`/`reqwest` moved with
# it — this crate no longer touches either directly. `embarch-topology`
# also dropped as a direct dependency: its only use here was
# `CoreConfig`'s default port constant, which moved with `CoreConfig`.
embarch-core-client = { path = "crates/embarch-core-client" }
# `alloc` (`embarch-study-designer` decision 46) backs `Study.steps`
# with a heap `Vec` instead of a 64-slot inline array of ~600-byte `Step`s.
# This crate is the one that actually crashed on the old shape — a debug build
# overflowed its stack serving a live `study_status` over MCP — and, unlike
# embarch-core/embarch-ui, it enables none of the `std`-implying features that
# would pull `alloc` in anyway, so it has to ask for it by name.
embarch-study-designer = { path = "../embarch-study-designer", features = ["alloc"] }
heapless = { version = "0.8", features = ["serde"] }
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9"
tokio = { version = "1.53.0", features = ["full"] }
toml = "1.1"
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = "0.3.23"
